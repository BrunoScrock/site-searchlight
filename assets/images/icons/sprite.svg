<!-- Sprite de ícones em SVG, para uso fora do index.html.

O index.html traz uma cópia inline deste sprite (mantida em `<defs>`) para
evitar uma requisição extra no carregamento inicial. Esta cópia serve para
reaproveitar os mesmos ícones em outros arquivos ou páginas do projeto.

Uso em um HTML qualquer:
  <svg class="icon" aria-hidden="true"><use href="assets/images/icons/sprite.svg#i-search"></use></svg>

Convenção: o ícone é desenhado com stroke="currentColor" e herda a cor do texto.
Classe opcional .icon--fill preenche o caminho em vez de contorná-lo.
-->

